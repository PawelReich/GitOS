name: GitHub Pages Deploy Action

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wget graphviz

      - name: Install Doxygen
        run: |
          DOXY_VER="1.16.1"
          TRANSFORMED_VER=$(echo "$DOXY_VER" | tr '.' '_')
          wget https://github.com/doxygen/doxygen/releases/download/Release_${TRANSFORMED_VER}/doxygen-${DOXY_VER}.linux.bin.tar.gz
          tar -xzf doxygen-${DOXY_VER}.linux.bin.tar.gz
          sudo mv doxygen-${DOXY_VER}/bin/doxygen /usr/local/bin/doxygen

      - name: Generate Doxygen Documentation
        run: doxygen scripts/Doxyfile
          
      - name: Create .nojekyll
        run: touch docs/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/html
